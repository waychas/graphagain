<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f7f8">
  <meta name="description" content="Explore functions by listening to their shape. Plot an equation and hear its pitch as you travel across the graph.">
  <title>Graph Tone</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='8' fill='%23ffffff' stroke='%23dddddd'/%3E%3Cpath d='M7 25c5 0 6-11 12-11s7 12 14 12' fill='none' stroke='%23111111' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.13.3/distrib/jsxgraph.css">
  <style>
    :root { color-scheme:light; --bg:#fff; --panel:#fff; --line:#dedede; --muted:#666; --text:#111; --blue:#111; --orange:#333; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; background:var(--bg); color:var(--text); font:14px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    main { width:min(1200px,100% - 32px); margin:0 auto; padding:17px 0 28px; }
    header { display:flex; align-items:center; height:34px; margin-bottom:12px; }
    .brand { font-weight:650; letter-spacing:-.02em; }
    .workspace { display:grid; grid-template-columns:230px minmax(0,1fr); gap:12px; min-height:600px; }
    .expression-panel { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:12px; }
    .expression-row { display:grid; grid-template-columns:1fr auto; gap:8px; align-items:center; }
    .equation-wrap { background:#fff; border:1px solid var(--line); border-left:3px solid var(--blue); border-radius:5px; display:flex; align-items:center; gap:7px; padding:0 8px; min-width:0; }
    .y-label { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; color:var(--blue); font-size:15px; white-space:nowrap; }
    input { font:inherit; color:var(--text); }
    #equation { width:100%; min-width:0; padding:9px 0; background:transparent; border:0; outline:0; font:15px ui-monospace,SFMono-Regular,Menlo,monospace; }
    #equation:focus-visible { outline:0; }
    button { border:1px solid var(--line); background:#fff; color:var(--text); border-radius:5px; padding:0 10px; min-height:38px; font:550 13px system-ui,sans-serif; cursor:pointer; }
    button:hover { background:#f5f5f5; }
    button:focus-visible,input:focus-visible { outline:2px solid var(--orange); outline-offset:3px; }
    .plot-meta { margin:11px 2px; color:var(--muted); font:12px ui-monospace,SFMono-Regular,Menlo,monospace; }
    .domain-controls { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:14px; }
    .domain-controls label { display:grid; gap:4px; color:var(--muted); font-size:11px; }
    .domain-controls input { width:100%; min-width:0; padding:6px 7px; border:1px solid var(--line); border-radius:4px; background:#fff; font:13px ui-monospace,SFMono-Regular,Menlo,monospace; }
    .domain-controls .start-control { grid-column:1 / -1; }
    .error { color:#b23b2b; min-height:1.4em; padding:6px 2px 0; font-size:12px; }
    .chart-shell { background:#fff; border:1px solid var(--line); border-radius:8px; padding:8px; overflow:hidden; }
    #board { width:100%; height:min(68vh,610px); min-height:340px; border:0; border-radius:4px; background:#fff; touch-action:none; }
    .JXGtext { color:#66747a!important; }
    .below-chart { display:grid; grid-template-columns:minmax(180px,1fr) minmax(145px,200px) auto; align-items:center; gap:15px; padding:9px 8px 6px; border-top:1px solid #ededed; }
    .scrub { display:grid; grid-template-columns:auto 1fr auto; align-items:center; gap:9px; color:var(--muted); font:11px ui-monospace,SFMono-Regular,Menlo,monospace; }
    input[type=range] { width:100%; accent-color:#111; cursor:pointer; }
    .speed { display:flex; align-items:center; gap:7px; color:var(--muted); font-size:12px; white-space:nowrap; }
    .speed input { width:66px; padding:6px 7px; border:1px solid var(--line); border-radius:4px; background:#fff; color:var(--text); font:13px ui-monospace,SFMono-Regular,Menlo,monospace; }
    .speed .unit { color:var(--text); }
    #play { min-height:34px; white-space:nowrap; }
    .readout { display:flex; flex-wrap:wrap; align-items:center; gap:7px; padding:8px; }
    .value { color:var(--muted); font:11px ui-monospace,SFMono-Regular,Menlo,monospace; }
    .value strong { color:var(--text); font-weight:550; }
    .pitch { color:var(--blue); }
    .foot { margin-top:8px; color:var(--muted); font-size:11px; }
    .foot p { margin:0; }
    @media(max-width:700px) { main{width:calc(100% - 20px);padding-top:10px}.workspace{grid-template-columns:1fr;gap:8px;min-height:0}.expression-panel{padding:8px}.plot-meta{display:none}#board{height:58vh;min-height:280px}.below-chart{grid-template-columns:1fr auto;gap:9px;padding:9px 4px}.scrub{grid-column:1/-1}.speed{grid-column:1}#play{grid-column:2;grid-row:2}.readout{padding:7px 4px}.foot{line-height:1.4} }
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;scroll-behavior:auto!important}}
  </style>
</head>
<body>
  <main>
    <header><div class="brand">Graph Tone</div></header>
    <div class="workspace">
      <aside class="expression-panel" aria-label="Expressions">
        <form class="expression-row" id="form">
          <label class="equation-wrap"><span class="y-label">y =</span><input id="equation" aria-label="Function of x" autocomplete="off" spellcheck="false" value="x" placeholder="sin(x) + x / 4"></label>
          <button id="apply" type="submit" aria-label="Plot function">↵</button>
        </form>
        <div class="error" id="error" role="status" aria-live="polite"></div>
        <div class="domain-controls" aria-label="Graph range">
          <label>X from<input id="x-min" type="number" value="-10" step="0.1" aria-label="Left X endpoint"></label>
          <label>X to<input id="x-max" type="number" value="10" step="0.1" aria-label="Right X endpoint"></label>
          <label class="start-control">Start at x<input id="start-x" type="number" value="0" step="0.1" aria-label="Starting X value"></label>
        </div>
        <div class="plot-meta">Pitch per sweep: 200–600 Hz</div>
      </aside>
      <section class="chart-shell" aria-label="Interactive function graph and sound controls">
        <div id="board" role="img" aria-label="Interactive coordinate graph"></div>
        <div class="below-chart">
          <div class="scrub"><span id="left-label">−10</span><input id="position" type="range" min="-10" max="10" step="0.002" value="0" aria-label="Move along the graph"><span id="right-label">10</span></div>
          <label class="speed">Velocity<input id="speed" type="number" min="0.5" max="20" step="0.1" value="1" inputmode="decimal" aria-label="Sweep velocity multiplier"><span class="unit" aria-hidden="true">×</span></label>
          <button id="play" type="button" aria-label="Play sound from left to right">▶ Play</button>
        </div>
        <div class="readout" aria-live="polite">
          <span class="value">x <strong id="x-value">0.00</strong></span>
          <span class="value">y <strong id="y-value">0.00</strong></span>
          <span class="value pitch">PITCH <strong id="frequency">200 Hz</strong></span>
        </div>
      </section>
    </div>
    <footer class="foot"><p>Click the graph to choose a start; drag to pan and scroll to zoom. Each sweep maps its chosen start and end to 200–600 Hz. Soft sine tone; device volume still applies.</p></footer>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.13.3/distrib/jsxgraphcore.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/14.8.1/math.min.js"></script>
  <script>
    (() => {
      let xMin = -10;
      let xMax = 10;
      let plotYMin = -5;
      let plotYMax = 5;
      const minHz = 200;
      const maxHz = 600;
      const equationInput = document.getElementById('equation');
      const error = document.getElementById('error');
      const slider = document.getElementById('position');
      const playButton = document.getElementById('play');
      const xValue = document.getElementById('x-value');
      const yValue = document.getElementById('y-value');
      const frequencyLabel = document.getElementById('frequency');
      const xMinInput = document.getElementById('x-min');
      const xMaxInput = document.getElementById('x-max');
      const startXInput = document.getElementById('start-x');

      if (!window.JXG || !window.math) {
        error.textContent = 'The graphing tools could not load. Check your connection and refresh the page.';
        document.getElementById('apply').disabled = true;
        playButton.disabled = true;
        return;
      }

      const board = JXG.JSXGraph.initBoard('board', {
        boundingbox: [xMin, plotYMax, xMax, plotYMin],
        axis: false,
        showCopyright: false,
        showNavigation: false,
        pan: { enabled: true, needShift: false },
        zoom: { enabled: true, wheel: true, needShift: false },
        defaultAxes: { x: { strokeColor: '#555', highlight: false }, y: { strokeColor: '#555', highlight: false } },
        grid: { strokeColor: '#f0f0f0', strokeWidth: 1 },
      });
      board.create('axis', [[0, 0], [1, 0]], { strokeColor: '#555', highlight: false, ticks: { drawLabels: true, majorHeight: 0, minorTicks: 0, strokeColor: '#ddd', label: { fontSize: 11, color: '#555' } } });
      board.create('axis', [[0, 0], [0, 1]], { strokeColor: '#555', highlight: false, ticks: { drawLabels: true, majorHeight: 0, minorTicks: 0, strokeColor: '#ddd', label: { fontSize: 11, color: '#555' } } });

      let expression;
      let graph;
      let functionYMin = -5;
      let functionYMax = 5;
      const marker = board.create('point', [0, 0], {
        name: '', size: 4, fixed: true, strokeColor: '#111', fillColor: '#111', highlight: false,
        withLabel: false,
      });

      function getY(x) {
        try {
          const value = Number(expression.evaluate({ x }));
          return Number.isFinite(value) ? value : NaN;
        } catch { return NaN; }
      }

      function frequencyForY(y) {
        const ySpan = functionYMax - functionYMin;
        const normalizedY = Math.abs(ySpan) < 1e-9
          ? 0.5
          : Math.min(1, Math.max(0, (y - functionYMin) / ySpan));
        return minHz * Math.pow(maxHz / minHz, normalizedY);
      }

      function setPosition(fraction, syncStart = true) {
        fraction = Math.min(1, Math.max(0, fraction));
        const x = xMin + fraction * (xMax - xMin);
        const y = getY(x);
        if (!Number.isFinite(y)) {
          marker.setAttribute({ visible: false });
          xValue.textContent = x.toFixed(2);
          yValue.textContent = 'undefined';
          frequencyLabel.textContent = '—';
          return null;
        }
        const hz = frequencyForY(y);
        marker.setAttribute({ visible: true });
        marker.moveTo([x, y]);
        xValue.textContent = x.toFixed(2);
        yValue.textContent = y.toFixed(2);
        frequencyLabel.textContent = `${Math.round(hz)} Hz`;
        if (syncStart) startXInput.value = x.toFixed(2);
        return { x, y, hz };
      }

      function plot() {
        try {
          stopSweep();
          const nextXMin = Number(xMinInput.value);
          const nextXMax = Number(xMaxInput.value);
          if (!Number.isFinite(nextXMin) || !Number.isFinite(nextXMax) || nextXMax <= nextXMin) {
            throw new Error('Set an X max greater than X min.');
          }
          const requestedStart = Number(startXInput.value);
          if (!Number.isFinite(requestedStart)) throw new Error('Enter a starting X value.');
          xMin = nextXMin;
          xMax = nextXMax;
          const startX = Math.min(xMax, Math.max(xMin, requestedStart));
          startXInput.value = startX.toFixed(2);
          const input = equationInput.value.trim().replace(/^y\s*=\s*/i, '');
          if (!input) throw new Error('Enter a function of x, like x^2 or sin(x).');
          const compiled = math.compile(input);
          expression = compiled;
          const samples = [];
          const discontinuities = [];
          let previousSample = null;
          for (let i = 0; i <= 600; i++) {
            const x = xMin + (i / 600) * (xMax - xMin);
            const y = getY(x);
            if (!Number.isFinite(y)) continue;
            if (previousSample && Math.sign(previousSample.y) !== Math.sign(y) && Math.max(Math.abs(previousSample.y), Math.abs(y)) > 4) {
              discontinuities.push([previousSample.x, x]);
            }
            samples.push(y);
            previousSample = { x, y };
          }
          if (!samples.length) throw new Error('This expression is not real-valued across the current X range.');
          let minY = Math.min(...samples);
          let maxY = Math.max(...samples);
          if (discontinuities.length) {
            const sorted = [...samples].sort((a, b) => a - b);
            minY = sorted[Math.floor(sorted.length * 0.05)];
            maxY = sorted[Math.min(sorted.length - 1, Math.ceil(sorted.length * 0.95))];
          }
          functionYMin = minY;
          functionYMax = maxY;
          const yPadding = Math.max(maxY - minY, Math.abs(minY) * 0.1, Math.abs(maxY) * 0.1, 1) * 0.08;
          plotYMin = minY - yPadding;
          plotYMax = maxY + yPadding;
          if (graph) board.removeObject(graph);
          let viewXMin = xMin;
          let viewXMax = xMax;
          const xSpan = xMax - xMin;
          const ySpan = plotYMax - plotYMin;
          const aspect = board.containerObj.clientWidth / board.containerObj.clientHeight;
          if (xSpan / ySpan < aspect) {
            const expandedXSpan = ySpan * aspect;
            const padding = (expandedXSpan - xSpan) / 2;
            viewXMin -= padding;
            viewXMax += padding;
          } else if (xSpan / ySpan > aspect) {
            const expandedYSpan = xSpan / aspect;
            const padding = (expandedYSpan - ySpan) / 2;
            plotYMin -= padding;
            plotYMax += padding;
          }
          board.setBoundingBox([viewXMin, plotYMax, viewXMax, plotYMin], true);
          const graphY = x => {
            if (discontinuities.some(([left, right]) => x >= left && x <= right)) return NaN;
            const y = getY(x);
            return discontinuities.length && (y < minY - yPadding || y > maxY + yPadding) ? NaN : y;
          };
          graph = board.create('functiongraph', [graphY, xMin, xMax], {
            strokeColor: '#111', strokeWidth: 3, highlight: false, numberPointsHigh: 1200,
          });
          document.getElementById('left-label').textContent = String(Number(xMin.toFixed(2))).replace('-', '−');
          document.getElementById('right-label').textContent = String(Number(xMax.toFixed(2)));
          slider.min = String(xMin);
          slider.max = String(xMax);
          slider.step = String((xMax - xMin) / 10000);
          error.textContent = '';
          const startFraction = (startX - xMin) / (xMax - xMin);
          slider.value = String(startX);
          setPosition(startFraction, false);
          board.update();
        } catch (err) {
          error.textContent = err && err.message ? err.message : 'Could not plot this expression.';
        }
      }

      let pointerDown;
      board.on('down', event => {
        if (Number.isFinite(event.clientX) && Number.isFinite(event.clientY)) {
          pointerDown = [event.clientX, event.clientY];
        }
      });
      board.on('up', event => {
        if (!pointerDown || !Number.isFinite(event.clientX) || !Number.isFinite(event.clientY)) return;
        const moved = Math.hypot(event.clientX - pointerDown[0], event.clientY - pointerDown[1]);
        pointerDown = null;
        if (moved > 4) return;
        const [graphX] = board.getUsrCoordsOfMouse(event);
        const selectedX = Math.round(Math.max(xMin, graphX) * 100) / 100;
        if (!Number.isFinite(selectedX)) return;
        stopSweep();
        startXInput.value = selectedX.toFixed(2);
        if (selectedX > xMax) {
          xMaxInput.value = (selectedX + 10).toFixed(2);
          plot();
          return;
        }
        slider.value = String(selectedX);
        const fraction = (selectedX - xMin) / (xMax - xMin);
        setPosition(fraction);
      });

      let audioContext;
      let oscillator;
      let gain;
      let animationFrame;
      let progress = 0;
      let previousFrame = 0;
      let sweepSpeed = 1;
      let playStart = 0;
      const sweepDuration = 10000;

      async function startAudio() {
        if (!audioContext) {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (!AudioContextClass) throw new Error('Audio is not supported in this browser.');
          audioContext = new AudioContextClass();
          oscillator = audioContext.createOscillator();
          gain = audioContext.createGain();
          oscillator.type = 'sine';
          oscillator.frequency.value = minHz;
          gain.gain.value = 0;
          oscillator.connect(gain).connect(audioContext.destination);
          oscillator.start();
        }
        await audioContext.resume();
      }

      function stopSweep() {
        cancelAnimationFrame(animationFrame);
        animationFrame = 0;
        playButton.textContent = '▶ Play';
        playButton.setAttribute('aria-label', 'Play sound from left to right');
        if (audioContext && oscillator) oscillator.frequency.cancelScheduledValues(audioContext.currentTime);
        if (audioContext && gain) gain.gain.setTargetAtTime(0, audioContext.currentTime, 0.035);
      }

      async function animate(now) {
        if (previousFrame) progress += (now - previousFrame) * sweepSpeed / sweepDuration;
        previousFrame = now;
        progress = Math.min(1, progress);
        const position = playStart + (1 - playStart) * progress;
        const point = setPosition(position);
        slider.value = String(xMin + position * (xMax - xMin));
        if (point && gain) gain.gain.setTargetAtTime(0.065, audioContext.currentTime, 0.01);
        if (progress < 1) animationFrame = requestAnimationFrame(animate);
        else stopSweep();
      }

      document.getElementById('form').addEventListener('submit', event => {
        event.preventDefault();
        stopSweep();
        startXInput.value = xMin.toFixed(2);
        plot();
      });
      let plotTimer;
      equationInput.addEventListener('input', () => {
        stopSweep();
        startXInput.value = xMin.toFixed(2);
        slider.value = String(xMin);
        window.clearTimeout(plotTimer);
        plotTimer = window.setTimeout(plot, 220);
      });
      xMinInput.addEventListener('change', plot);
      xMaxInput.addEventListener('change', plot);
      startXInput.addEventListener('input', () => {
        stopSweep();
        const x = Number(startXInput.value);
        if (!Number.isFinite(x) || x < xMin || x > xMax) return;
        const fraction = (x - xMin) / (xMax - xMin);
        slider.value = String(x);
        setPosition(fraction, false);
      });
      startXInput.addEventListener('change', () => {
        const x = Number(startXInput.value);
        if (Number.isFinite(x)) {
          stopSweep();
          const clampedX = Math.min(xMax, Math.max(xMin, x));
          const fraction = (clampedX - xMin) / (xMax - xMin);
          slider.value = String(clampedX);
          setPosition(fraction);
        }
      });
      const speedInput = document.getElementById('speed');
      sweepSpeed = Number(speedInput.value);
      speedInput.addEventListener('input', () => {
        const value = Number(speedInput.value);
        if (Number.isFinite(value) && value >= 0.5 && value <= 20) sweepSpeed = value;
      });
      speedInput.addEventListener('change', () => {
        const value = Number(speedInput.value);
        sweepSpeed = Number.isFinite(value) ? Math.min(20, Math.max(0.5, value)) : sweepSpeed;
        speedInput.value = String(sweepSpeed);
      });
      slider.addEventListener('input', () => {
        stopSweep();
        const fraction = (Number(slider.value) - xMin) / (xMax - xMin);
        const point = setPosition(fraction);
        if (point && audioContext && audioContext.state === 'running') {
          oscillator.frequency.setTargetAtTime(point.hz, audioContext.currentTime, 0.035);
          gain.gain.setTargetAtTime(0.035, audioContext.currentTime, 0.035);
          window.clearTimeout(slider.soundTimeout);
          slider.soundTimeout = window.setTimeout(() => gain.gain.setTargetAtTime(0, audioContext.currentTime, 0.04), 100);
        }
      });
      playButton.addEventListener('click', async () => {
        if (animationFrame) { stopSweep(); return; }
        try {
          await startAudio();
          progress = 0;
          previousFrame = performance.now();
          const requestedStart = Number(startXInput.value);
          playStart = (Math.min(xMax, Math.max(xMin, requestedStart)) - xMin) / (xMax - xMin);
          slider.value = String(xMin + playStart * (xMax - xMin));
          const startPoint = setPosition(playStart);
          const durationSeconds = sweepDuration * (1 - playStart) / (1000 * sweepSpeed);
          const frequencyCurve = new Float32Array(4096);
          let lastHz = startPoint ? startPoint.hz : (minHz + maxHz) / 2;
          for (let i = 0; i < frequencyCurve.length; i++) {
            const fraction = playStart + (1 - playStart) * i / (frequencyCurve.length - 1);
            const y = getY(xMin + fraction * (xMax - xMin));
            if (Number.isFinite(y)) lastHz = frequencyForY(y);
            frequencyCurve[i] = lastHz;
          }
          const audioNow = audioContext.currentTime;
          oscillator.frequency.cancelScheduledValues(audioNow);
          if (durationSeconds > 0.002) oscillator.frequency.setValueCurveAtTime(frequencyCurve, audioNow, durationSeconds);
          else oscillator.frequency.setValueAtTime(frequencyCurve[frequencyCurve.length - 1], audioNow);
          gain.gain.setTargetAtTime(0.065, audioNow, 0.01);
          playButton.textContent = 'Ⅱ Pause';
          playButton.setAttribute('aria-label', 'Pause sound sweep');
          animationFrame = requestAnimationFrame(animate);
        } catch {
          error.textContent = 'Audio could not start. Try tapping Play again.';
        }
      });
      window.addEventListener('resize', () => {
        board.resizeContainer(board.containerObj.clientWidth, board.containerObj.clientHeight, true);
        plot();
      });

      plot();
    })();
  </script>
</body>
</html>
